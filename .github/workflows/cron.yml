name: AND센터 크론 파이프라인

on:
  schedule:
    # Targeting DC (ET) + London (GMT) English-speaking audience
    - cron: "0 12 * * 1-5"   # UTC 12:00 = DC 08:00 + London 12:00 (core slot)
    - cron: "0 14 * * 1-5"   # UTC 14:00 = DC 10:00 + EU 14:00
    - cron: "0 17 * * 1-5"   # UTC 17:00 = DC 13:00 + EU 17:00
    - cron: "0 21 * * 1-5"   # UTC 21:00 = DC 17:00 (core slot)
    - cron: "0 0 * * 2-6"    # UTC 00:00 = DC 20:00 (casual browsing)
  workflow_dispatch: # 대시보드에서 수동 트리거 가능

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel 크론 호출
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://x-bot-iota.vercel.app/api/cron)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Response: $body"
          if [ "$status" != "200" ]; then
            echo "크론 실패: HTTP $status"
            exit 1
          fi
